<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kuubik Draw documents live harness</title>
  </head>
  <body>
    <main>
      <h1>Documents live harness</h1>
      <pre id="result" data-status="running">Running…</pre>
    </main>
    <script type="module">
      import { runDocumentsLiveHarness } from "./documents-live-harness.ts";

      const output = document.querySelector("#result");
      try {
        const result = await runDocumentsLiveHarness(indexedDB, {
          databaseName: `kuubik-draw-documents-live-${crypto.randomUUID()}`,
          resetDatabase: false,
        });
        output.dataset.status = "passed";
        output.textContent = JSON.stringify(result, null, 2);
      } catch (error) {
        output.dataset.status = "failed";
        output.textContent = error instanceof Error ? `${error.name}: ${error.message}` : String(error);
      }
    </script>
  </body>
</html>
