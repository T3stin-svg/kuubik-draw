name: draw-ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      row_id:
        description: "Optional certified row to rerun through the portable row pipeline (F-000)."
        required: false
        type: string

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"
      - run: npm ci
      - run: python -m pip install --disable-pip-version-check pypdf==6.10.0 pdfplumber==0.11.9
      - run: npm run check:fast

  verify:
    needs: fast
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils=24.02.0-1ubuntu9.9
      - run: python -m pip install --disable-pip-version-check pypdf==6.10.0 pdfplumber==0.11.9
      - run: npm run check:certification

  row-certification:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.row_id != '' }}
    needs: fast
    runs-on: ubuntu-24.04
    env:
      PARITY_ROW_ID: ${{ inputs.row_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install --disable-pip-version-check ezdxf==1.4.3 pypdf==6.10.0 pdfplumber==0.11.9
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils=24.02.0-1ubuntu9.9
      - run: test "$(dpkg-query -W -f='${Version}' poppler-utils)" = "24.02.0-1ubuntu9.9"
      - shell: bash
        run: npm run parity:row -- "$PARITY_ROW_ID" --portable

  required-oracles:
    if: ${{ vars.REQUIRE_CAD_ORACLES == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: [self-hosted, cad-oracles]
    environment: cad-oracles
    env:
      KUUBIK_ORACLE_NETWORK_ATTESTATION_PATH: ${{ vars.KUUBIK_ORACLE_NETWORK_ATTESTATION_PATH }}
      KUUBIK_ORACLE_NETWORK_ATTESTATION_KEY: ${{ secrets.KUUBIK_ORACLE_NETWORK_ATTESTATION_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:oracles -- --require
      - run: npm run parity:f022:oracles
      - run: npm run parity:f022:cross-evidence
      - run: npm run parity:f023:oracles
      - run: npm run parity:f023:cross-evidence
      - run: npm run parity:f024:oracles
      - run: npm run parity:f024:cross-evidence
      - run: npm run parity:f025:oracles
      - run: npm run parity:f025:cross-evidence
      - run: npm run parity:f026:oracles
      - run: npm run parity:f026:cross-evidence

  autocad-2024-certification:
    if: ${{ vars.REQUIRE_AUTOCAD_CERTIFICATION == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: [self-hosted, windows, autocad-2024]
    environment: autocad-2024-certification
    timeout-minutes: 15
    env:
      PYTHON_CMD: python
      PDFTOPPM_CMD: pdftoppm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check ezdxf==1.4.3 pypdf==6.10.0 pdfplumber==0.11.9
          if (-not (Get-Command pdftoppm -ErrorAction SilentlyContinue)) { throw 'pdftoppm is required on the licensed AutoCAD runner.' }
      - run: npm run parity:f022:browser-artifact
      - run: npm run parity:f022:readback
      - run: npm run parity:f022:autocad
      - run: npm run parity:f022:cross-evidence
      - run: npm run parity:f023:browser-artifact
      - run: npm run parity:f023:readback
      - run: npm run parity:f023:autocad
      - run: npm run parity:f023:cross-evidence
      - run: npm run parity:f024:browser-artifact
      - run: npm run parity:f024:readback
      - run: npm run parity:f024:autocad
      - run: npm run parity:f024:oracles
      - run: npm run parity:f024:cross-evidence
      - run: npm run parity:f025:browser-artifact
      - run: npm run parity:f025:readback
      - run: npm run parity:f025:autocad
      - run: npm run parity:f025:oracles
      - run: npm run parity:f025:cross-evidence
      - run: npm run parity:f026:browser-artifact
      - run: npm run parity:f026:readback
      - run: npm run parity:f026:autocad
      - run: npm run parity:f026:oracles
      - run: npm run parity:f026:cross-evidence
      - run: npm run parity:f102:browser-artifact
      - run: npm run parity:f102:readback
      - run: npm run parity:f102:autocad
      - run: npm run parity:f102:cross-evidence
      - run: npm run parity:f103:browser-artifact
      - run: npm run parity:f103:readback
      - run: npm run parity:f103:autocad
      - run: npm run parity:f103:cross-evidence
      - run: npm run parity:f104:browser-artifact
      - run: npm run parity:f104:readback
      - run: npm run parity:f104:autocad
      - run: npm run parity:f104:cross-evidence
      - run: npm run parity:f105:browser-artifact
      - run: npm run parity:f105:readback
      - run: npm run parity:f105:autocad
      - run: npm run parity:f105:cross-evidence
      - run: npm run parity:f106:browser-artifact
      - run: npm run parity:f106:readback
      - run: npm run parity:f106:autocad
      - run: npm run parity:f106:cross-evidence
      - run: npm run parity:f107:browser-artifact
      - run: npm run parity:f107:readback
      - run: npm run parity:f107:autocad
      - run: npm run parity:f107:cross-evidence
      - run: npm run parity:f109:browser-artifact
      - run: npm run parity:f109:readback
      - run: npm run parity:f109:autocad
      - run: npm run parity:f109:cross-evidence
      - run: npm run parity:f111:browser-artifact
      - run: npm run parity:f111:readback
      - run: npm run parity:f111:autocad
      - run: npm run parity:f111:cross-evidence
      - run: npm run parity:f114:browser-artifact
      - run: npm run parity:f114:readback
      - run: npm run parity:f114:autocad
      - run: npm run parity:f114:cross-evidence
