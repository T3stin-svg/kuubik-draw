<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kuubik Draw layout/plot shell harness</title>
  </head>
  <body>
    <main>
      <h1>Layout/plot shell harness</h1>
      <pre id="result" data-status="running">Running...</pre>
    </main>
    <script type="module">
      import { runLayoutPlotShellHarness } from "./layout-plot-shell-harness.ts";

      const output = document.querySelector("#result");
      try {
        const result = await runLayoutPlotShellHarness(indexedDB, {
          databaseName: `kuubik-draw-layout-plot-${crypto.randomUUID()}`,
          resetDatabase: false,
        });
        output.dataset.status = "passed";
        output.textContent = JSON.stringify(result, null, 2);
      } catch (error) {
        output.dataset.status = "failed";
        output.textContent = error instanceof Error ? `${error.name}: ${error.message}` : String(error);
      }
    </script>
  </body>
</html>
