name: draw-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check

  required-oracles:
    if: ${{ vars.REQUIRE_CAD_ORACLES == 'true' }}
    runs-on: [self-hosted, cad-oracles]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:oracles -- --require

  autocad-2024-certification:
    if: ${{ vars.REQUIRE_AUTOCAD_CERTIFICATION == 'true' }}
    runs-on: [self-hosted, windows, autocad-2024]
    timeout-minutes: 15
    env:
      PYTHON_CMD: python
      PDFTOPPM_CMD: pdftoppm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pypdf==6.10.0 pdfplumber==0.11.9
          if (-not (Get-Command pdftoppm -ErrorAction SilentlyContinue)) { throw 'pdftoppm is required on the licensed AutoCAD runner.' }
      - run: npm run parity:f102:browser-artifact
      - run: npm run parity:f102:readback
      - run: npm run parity:f102:autocad
      - run: npm run parity:f102:cross-evidence
      - run: npm run parity:f103:browser-artifact
      - run: npm run parity:f103:readback
      - run: npm run parity:f103:autocad
      - run: npm run parity:f103:cross-evidence
