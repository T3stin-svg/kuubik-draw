<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kuubik document workspace harness</title>
  </head>
  <body>
    <main>
      <h1>Kuubik document workspace harness</h1>
      <output id="status">running</output>
      <pre id="result"></pre>
    </main>
    <script type="module">
      import { runDocumentWorkspaceHarness } from "./document-workspace-harness.ts";
      const status = document.querySelector("#status");
      const result = document.querySelector("#result");
      try {
        const readback = await runDocumentWorkspaceHarness();
        status.textContent = "passed";
        result.textContent = JSON.stringify(readback, null, 2);
        window.__KUUBIK_DOCUMENT_WORKSPACE_RESULT__ = readback;
      } catch (error) {
        status.textContent = "failed";
        result.textContent = error instanceof Error ? `${error.name}: ${error.message}\n${error.stack ?? ""}` : String(error);
        throw error;
      }
    </script>
  </body>
</html>
